<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}Montauk{% endblock %}</title>
  <link rel="stylesheet" href="/static/montauk.css">
  <script src="/static/montauk.js" defer></script>
</head>
<body>
{% if auth %}
<header class="topbar">
  <span class="brand"><a href="/" style="text-decoration:none;color:inherit">Montauk</a></span>
  <nav>
    <a href="/">Home</a>
    <a href="/people">People</a>
    <a href="/transcripts">Transcripts</a>
    <a href="/settings">Settings</a>
  </nav>
  <span class="spacer"></span>
  <span class="muted">{{ workspace_slug }} &middot; {{ auth.email }}</span>
  <form method="post" action="/logout" class="inline">
    <input type="hidden" name="_csrf" value="{{ csrf }}">
    <button class="secondary" type="submit">Log out</button>
  </form>
</header>
{% endif %}
<main>
  {% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}
  {% if flash %}<div class="notice" role="status">{{ flash }}</div>{% endif %}
  {% block body %}{% endblock %}
</main>
</body>
</html>
