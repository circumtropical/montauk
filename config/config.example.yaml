# Montauk deployment configuration (spec section 31).
#
# Copy this file (e.g. to config.yaml) and adjust for your deployment.
# This file holds non-secret settings only -- agent credentials are
# managed separately via `montauk agents create` and never belong here.

# Where the canonical Markdown data (people/, archive/) and derived
# indexes live. Keep this outside any public source repository.
data_dir: /var/lib/montauk

transport:
  # "stdio" for a single local agent host (e.g. a desktop assistant
  # launching `montauk serve` directly); "remote" for authenticated
  # HTTPS access by multiple agents.
  mode: stdio
  # Only used when mode is "remote". Binding 0.0.0.0 requires auth to be
  # configured (montauk refuses to start otherwise) -- put a TLS-
  # terminating reverse proxy in front for real remote deployments.
  host: 127.0.0.1
  port: 8765
  # For mode: remote, the external URL agents connect to through the
  # reverse proxy. When set, the transport accepts this hostname in the
  # Host header, so the proxy can forward requests unchanged. When unset,
  # DNS-rebinding protection is disabled for the remote transport (every
  # request is still bearer-authenticated). Ignored for stdio.
  # public_url: https://montauk.example.com

git:
  enabled: true
  # 24-hour local time; at most one automatic commit is made per day,
  # only if canonical data actually changed. Never auto-pushes.
  daily_snapshot_time: "03:00"

search:
  semantic_enabled: true
  max_candidates: 5
  # Calibrated for the default local embedding model (see `embedding`
  # below); if you change the model, recalibrate this against a few
  # known related/unrelated text pairs before trusting the default.
  similarity_threshold: 0.35

retrieval:
  # Output-content token budgets for prepare_person_context. An explicit
  # max_tokens argument overrides the preset, clamped to [min, max].
  # The budget governs the selected evidence text (summary + facts +
  # relationships + interactions), not the small response envelope.
  brief_tokens: 750
  standard_tokens: 2000
  comprehensive_tokens: 6000
  min_tokens: 100
  max_tokens: 8000
  # Lexical (BM25) retrieval is always available and needs no index.
  # Semantic retrieval adds vector similarity when the embedding provider
  # is up; when it isn't, retrieval falls back to lexical and says so.
  lexical_enabled: true
  semantic_enabled: true
  # A long interaction summary is split at sentence boundaries into
  # overlapping chunks for indexing (facts / the person summary are not).
  interaction_chunk_tokens: 120
  interaction_chunk_overlap_tokens: 24

embedding:
  # Only "local" runs by default: embeddings are computed on this machine
  # with a small CPU model and NO relationship data leaves the box. A
  # hosted provider (none ship yet) would require an explicit provider
  # name here plus enablement -- an API key in the environment is never
  # on its own authorization to upload personal data.
  provider: local
  model: sentence-transformers/all-MiniLM-L6-v2

logging:
  level: INFO
  retention_days: 30
