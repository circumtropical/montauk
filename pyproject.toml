[project]
name = "montauk-mcp"
version = "0.1.0"
description = "Montauk — relationship memory for personal agents. An MCP server giving a personal-assistant agent durable, private, human-readable memory of the people in one human user's life."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.1,<3",
    "pydantic>=2.12",
    "pyyaml>=6.0",
    "fastembed>=0.8.0",
    "numpy>=2.0",
    "typer>=0.15",
    "starlette>=0.38",
    "uvicorn>=0.30",
    "tzdata; sys_platform == 'win32'",
    "sqlalchemy>=2.0.52",
    "alembic>=1.19.2",
    "psycopg[binary]>=3.3.5",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "itsdangerous>=2.2.0",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.1",
    "anthropic>=1.4.0",
]

[project.scripts]
montauk = "montauk.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/montauk"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.16.6",
    "testcontainers[postgres]>=4.15.0",
    "types-PyYAML>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["src/montauk/db/alembic/versions"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "W"]
# str+Enum is an established pattern in schema.py/dates.py and relied on for
# value serialization; StrEnum's differing str() is not a safe swap here.
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
"src/montauk/db/alembic/env.py" = ["E402"]

[tool.mypy]
# 3.12 so mypy can parse third-party stubs that use PEP 695 syntax (numpy).
# Runtime support is still >=3.11 -- ruff (target py311) and the CI 3.11 job
# guard against actually using 3.12-only syntax in our code.
python_version = "3.12"
# The service layer is fully typed. person_context.py / semantic_index.py
# (the shared retrieval engine, carried over from Phase 1) are checked
# transitively but not held to disallow_untyped_defs yet -- tracked
# separately (ADR 0001).
files = [
    "src/montauk/db",
    "src/montauk/services",
    "src/montauk/exporters",
    "src/montauk/web",
    "src/montauk/llm",
    "src/montauk/mcp2",
    "src/montauk/cli.py",
    "src/montauk/cli_phase2.py",
]
plugins = []
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["testcontainers.*", "argon2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
ignore_missing_imports = true
