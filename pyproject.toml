[project]
name = "montauk-mcp"
version = "0.1.0"
description = "Montauk — relationship memory for personal agents. An MCP server giving a personal-assistant agent durable, private, human-readable memory of the people in one human user's life."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.1,<3",
    "pydantic>=2.12",
    "pyyaml>=6.0",
    "fastembed>=0.8.0",
    "numpy>=2.0",
    "typer>=0.15",
    "starlette>=0.38",
    "uvicorn>=0.30",
    "tzdata; sys_platform == 'win32'",
]

[project.scripts]
montauk = "montauk.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/montauk"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
