name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Cache embedding model weights
        uses: actions/cache@v4
        with:
          path: .fastembed_cache
          key: fastembed-all-MiniLM-L6-v2-${{ runner.os }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -q
        env:
          FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed_cache
